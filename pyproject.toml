[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dond-analysis"
version = "0.1.0"
description = "Reproducible utility-based Deal or No Deal experiments and figures"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{name = "Zeiteigen"}]
dependencies = ["matplotlib>=3.10,<4", "numpy>=2.2,<3", "scipy>=1.15,<2"]

[project.urls]
Repository = "https://github.com/zeiteigen/deal-no-deal"

[project.scripts]
dond = "dond_analysis.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dond_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
